<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pupil Quiz</title>
</head>

<body>

    <h1>PUPIL QUIZ</h1>

    <p>Question 1 of 1</p>

    <h2>What is the capital of Nigeria?</h2>

    <label>
        <input type="radio" name="answer" value="Lagos">
        Lagos
    </label>

    <br>

    <label>
        <input type="radio" name="answer" value="Abuja">
        Abuja
    </label>

    <br>

    <label>
        <input type="radio" name="answer" value="Kano">
        Kano
    </label>

    <br>

    <label>
        <input type="radio" name="answer" value="Ibadan">
        Ibadan
    </label>

    <br><br>

    <button onclick="checkAnswer()">Submit Answer</button>

    <p id="result"></p>

    <script>

        function checkAnswer() {

            const answer =
                document.querySelector('input[name="answer"]:checked');

            if (!answer) {
                alert("Please select an answer.");
                return;
            }

            if (answer.value === "Abuja") {

                document.getElementById("result").textContent =
                    "Correct! 🎉";

            } else {

                document.getElementById("result").textContent =
                    "Wrong answer.";

            }

        }

    </script>

</body>

      </html>
